services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: railvoice-postgres
    environment:
      POSTGRES_USER: railvoice
      POSTGRES_PASSWORD: railvoice
      POSTGRES_DB: railvoice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railvoice -d railvoice"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: railvoice-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./railvoice-backend
      dockerfile: Dockerfile
    container_name: railvoice-api
    env_file:
      - ./railvoice-backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://railvoice:railvoice@postgres:5432/railvoice
      DATABASE_URL_SYNC: postgresql://railvoice:railvoice@postgres:5432/railvoice
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:3001,http://127.0.0.1:3001
      PUBLIC_BASE_URL: http://localhost:8000
      LOCAL_STORAGE_PATH: storage/uploads
      GOOGLE_OAUTH_MOCK_MODE: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./railvoice-backend:/app
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./railvoice-backend
      dockerfile: Dockerfile
    container_name: railvoice-worker
    env_file:
      - ./railvoice-backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://railvoice:railvoice@postgres:5432/railvoice
      DATABASE_URL_SYNC: postgresql://railvoice:railvoice@postgres:5432/railvoice
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./railvoice-backend:/app
    command: celery -A app.workers.celery_app worker --loglevel=info -Q high,default,low

  beat:
    build:
      context: ./railvoice-backend
      dockerfile: Dockerfile
    container_name: railvoice-beat
    env_file:
      - ./railvoice-backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://railvoice:railvoice@postgres:5432/railvoice
      DATABASE_URL_SYNC: postgresql://railvoice:railvoice@postgres:5432/railvoice
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis
      - worker
    volumes:
      - ./railvoice-backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info

volumes:
  postgres_data:
  redis_data:
