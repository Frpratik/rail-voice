upstream railvoice_web {
    server web:3000;
}

upstream railvoice_api {
    server api:8000;
}

# Default: single-host HTTP proxy (works without TLS certs).
# For HTTPS, replace this file with contents from railvoice.tls.conf.example
# and put certificates in deploy/certs/.
server {
    listen 80;
    server_name _;

    client_max_body_size 12m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /media/ {
        alias /var/www/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://railvoice_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://railvoice_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://railvoice_api/health;
    }

    location /health/ready {
        proxy_pass http://railvoice_api/health/ready;
    }

    location /metrics {
        proxy_pass http://railvoice_api/metrics;
        # Restrict in real production (VPN / internal only).
        # allow 10.0.0.0/8; deny all;
    }

    location /docs {
        proxy_pass http://railvoice_api/docs;
    }

    location /openapi.json {
        proxy_pass http://railvoice_api/openapi.json;
    }

    location / {
        proxy_pass http://railvoice_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
