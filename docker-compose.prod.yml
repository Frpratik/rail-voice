# ---- Production stack (Phase 11) ----
# Usage:
#   cp .env.production.example .env.production
#   # edit secrets / domains
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

name: railvoice-prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-railvoice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-railvoice}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-railvoice} -d ${POSTGRES_DB:-railvoice}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  api:
    build:
      context: ./railvoice-backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-railvoice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-railvoice}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-railvoice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-railvoice}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.example.com}
      LOCAL_STORAGE_PATH: /app/storage/uploads
      RUN_SEED: ${RUN_SEED:-false}
      OTP_MOCK_MODE: ${OTP_MOCK_MODE:-false}
      GOOGLE_OAUTH_MOCK_MODE: ${GOOGLE_OAUTH_MOCK_MODE:-false}
    volumes:
      - media_data:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 3

  worker:
    build:
      context: ./railvoice-backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-railvoice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-railvoice}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-railvoice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-railvoice}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      LOCAL_STORAGE_PATH: /app/storage/uploads
      RUN_SEED: "false"
    volumes:
      - media_data:/app/storage/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    networks: [internal]
    entrypoint: ["./scripts/entrypoint.sh"]
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=info", "-Q", "high,default,low"]

  beat:
    build:
      context: ./railvoice-backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      APP_ENV: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-railvoice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-railvoice}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-railvoice}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-railvoice}
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      RUN_SEED: "false"
    depends_on:
      - redis
      - worker
    networks: [internal]
    entrypoint: ["./scripts/entrypoint.sh"]
    command: ["celery", "-A", "app.workers.celery_app", "beat", "--loglevel=info"]

  web:
    build:
      context: ./railvoice-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.example.com/api/v1}
    restart: unless-stopped
    depends_on:
      - api
    networks: [internal]
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - media_data:/var/www/media:ro
    depends_on:
      - api
      - web
    networks: [internal, edge]

volumes:
  postgres_data:
  redis_data:
  media_data:

networks:
  internal:
    driver: bridge
  edge:
    driver: bridge
